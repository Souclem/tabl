name: app
description: "Tabl — application mobile."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# app/ est le SEUL endroit où l'UI et le métier se rencontrent :
# on récupère les données via tabl_core, on les passe à tabl_ui.
dependencies:
  flutter:
    sdk: flutter
  tabl_ui:
    path: ../packages/tabl_ui
  tabl_core:
    path: ../packages/tabl_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
